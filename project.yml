# XcodeGen 工程描述。生成：xcodegen generate
name: LocalCICD
options:
  bundleIdPrefix: io.github.loveyu233
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Models: { path: Packages/Models }
  Platform: { path: Packages/Platform }
  Storage: { path: Packages/Storage }
  GitKit: { path: Packages/GitKit }
  LogKit: { path: Packages/LogKit }
  Runner: { path: Packages/Runner }
  PushWatch: { path: Packages/PushWatch }
  ApplicationKit: { path: Packages/ApplicationKit }

targets:
  LocalCICD:
    type: application
    platform: macOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.loveyu233.cicdlocal
        PRODUCT_NAME: LocalCICD
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: App/Resources/LocalCICD.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleName: LocalCICD
        CFBundleDisplayName: 本地 CI
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        NSRemovableVolumesUsageDescription: "读取您选择的 Git 仓库，并在应用数据目录中保存运行日志。"
        CFBundleURLTypes:
          - CFBundleURLName: io.github.loveyu233.cicdlocal.record
            CFBundleURLSchemes: [localcicd]
            CFBundleTypeRole: Viewer
    entitlements:
      path: App/Resources/LocalCICD.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      - package: Models
      - package: Platform
      - package: Storage
      - package: GitKit
      - package: LogKit
      - package: Runner
      - package: PushWatch
      - package: ApplicationKit
      - target: HookHelper
        embed: true
        codeSign: true
        copy:
          destination: executables

  HookHelper:
    type: tool
    platform: macOS
    sources:
      - path: HookHelper
    dependencies:
      - package: PushWatch
        product: HookProtocol
    settings:
      base:
        PRODUCT_NAME: localcicd-hook
        SKIP_INSTALL: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.loveyu233.cicdlocal.hook

  LocalCICDUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.loveyu233.cicdlocal.uitests
        GENERATE_INFOPLIST_FILE: YES
        # 临时签名的 XCTest Runner 需要加载本地测试 bundle；应用目标保持原设置。
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        TEST_TARGET_NAME: LocalCICD
    dependencies:
      - target: LocalCICD

schemes:
  LocalCICD:
    build:
      targets:
        LocalCICD: all
        HookHelper: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LocalCICDUITests
      gatherCoverageData: false
