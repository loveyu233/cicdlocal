name: 公开源码检查
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 检查隐私文件与机器路径
        run: |
          python3 scripts/test-source-guards.py
          python3 scripts/check-public-source.py
      - name: 扫描公开 Git 历史中的凭据
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d)
          cd "$scanner_dir"
          curl --fail --silent --show-error --location --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git "$GITHUB_WORKSPACE" --log-opts=--all --redact --no-banner
